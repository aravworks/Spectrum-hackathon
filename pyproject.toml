[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "waste-platform-ml"
version = "0.1.0"
description = "ML modules for the National Waste Management Platform"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
routing-full = [
    "ortools>=9.8",         # OR-Tools VRP solver (Phase 2)
    "httpx>=0.25",          # OSRM / Maps API distance providers
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
all = [
    "waste-platform-ml[routing-full,dev]",
]

[tool.pytest.ini_options]
testpaths = ["ml"]
python_files = ["test_*.py", "tests/*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["ml*"]
